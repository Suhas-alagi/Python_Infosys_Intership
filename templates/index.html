<!DOCTYPE html>
<html>
<head>
    <title>Air Quality Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <a href="/">Home</a> |
        <a href="/eda">Data Explorer</a> |
        <a href="/model">Forecast Engine</a>
    </nav>
    <h1>Latest Pollutant Average: {{ latest_avg }}</h1>
    <h2>Predict Pollutant Average</h2>
    <form id="predictForm">
        <label>Latitude:</label><input type="number" step="any" name="latitude" required><br>
        <label>Longitude:</label><input type="number" step="any" name="longitude" required><br>
        <label>Pollutant ID (e.g. PM2.5, SO2):</label><input type="text" name="pollutant_id" required><br>
        <label>Pollutant Min:</label><input type="number" step="any" name="pollutant_min" required><br>
        <label>Pollutant Max:</label><input type="number" step="any" name="pollutant_max" required><br>
        <button type="submit">Predict</button>
    </form>
    <div id="result"></div>
    <script>
        document.getElementById('predictForm').onsubmit = async function(e) {
            e.preventDefault();
            let data = {};
            Array.from(this.elements).forEach(el => {
                if (el.name) data[el.name] = el.value;
            });
            let res = await fetch('/predict', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            let result = await res.json();
            document.getElementById('result').innerText = "Predicted Pollutant Average: " + result.predicted_avg;
        }
    </script>
</body>
</html>
